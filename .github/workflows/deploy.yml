name: CI/CD ClinicFlow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'amazon-corretto'
          java-version: '17'

      - name: Build and Package with Maven
        run: mvn clean package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinicflow-app
          path: target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'amazon-corretto'
          java-version: '17'

      - name: Gerar o JAR
        run: mvn clean package

      - name: Enviar via SCP para a AWS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "target/ClinicFlow-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user"
          strip_components: 1

      - name: Inicializar o sistema na AWS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ec2-user
            pkill -f 'ClinicFlow' || true
            nohup java -jar ClinicFlow-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
