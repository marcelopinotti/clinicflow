name: Build and Deploy ClinicFlow

on:
  push:
    branches:
      [main, develop]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'amazon-corretto'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install







  deploy: