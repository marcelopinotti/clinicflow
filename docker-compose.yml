services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicflow
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5431:5432"
    volumes:
      - clinicflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clinicflow_postgres_data:

